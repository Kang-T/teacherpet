# 아이들이 실제로 쓰는 web/ 빌드를 헤드리스 크롬으로 열어 확인한다.
# 배포(pages.yml)를 막지는 않는다 — 화면 검사는 이따금 불안정할 수 있어서,
# 실패하면 알려만 주고 사이트는 계속 나간다.
name: check

on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'package.json', '.github/workflows/check.yml']
  pull_request:
  workflow_dispatch:

jobs:
  behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # three.js 는 저장소에 들어 있고(src/renderer/vendor), 크롬은 러너에 이미 있다.
      # 그래서 설치 단계가 하나도 없다. xvfb 도 Electron 도 필요 없다.
      - name: 크롬 확인
        run: google-chrome --version
      - name: 행동 검사
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/check.js
      # 새 버전이 올라갈 때 아이 기기에 옛 CSS·JS 가 섞이지 않는지 (서비스 워커 캐시)
      - name: 업데이트 검사
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/check-update.js
