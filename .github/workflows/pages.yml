# main 에 올리면 웹 버전이 자동으로 배포된다 (GitHub Pages)
name: web

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build-web.js'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: three.js 준비
        run: npm install --no-save three@0.170.0
      - name: 웹 빌드
        run: node scripts/build-web.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
